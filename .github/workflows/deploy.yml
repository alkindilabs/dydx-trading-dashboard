name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight deploys when a newer commit lands so we don't race.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        # Same suite as the tests workflow; deploy is gated on it passing
        # so a broken metric never reaches the live worker.
        run: npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # account_id is already pinned in wrangler.jsonc to al-Kindi LDA;
          # do NOT pass it here so the file stays the source of truth.
          command: deploy
